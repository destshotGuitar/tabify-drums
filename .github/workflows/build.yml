name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
          - name: macOS
            os: macos-14
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTABIFY_BUILD_TESTHOST=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 4 --target TabifyDrums_All TabifyDrums_CLAP

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/TabifyDrums_artefacts/Release/* dist/
          rm -f dist/*.a dist/*.lib

      - uses: actions/upload-artifact@v4
        with:
          name: TabifyDrums-${{ matrix.name }}
          path: dist

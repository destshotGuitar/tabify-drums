name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            platform: linux-x64
          - name: Windows
            os: windows-2022
            platform: windows-x64
          - name: macOS
            os: macos-14
            platform: macos-universal
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then generator="-G Ninja"; fi
          cmake -S . -B build $generator -DCMAKE_BUILD_TYPE=Release -DTABIFY_BUILD_TESTHOST=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 4 --target TabifyDrums_All TabifyDrums_CLAP

      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="dev-${GITHUB_SHA::7}"; fi
          name="TabifyDrums-$version-${{ matrix.platform }}"
          src="build/TabifyDrums_artefacts/Release"

          mkdir -p "dist/$name"
          for format in VST3 CLAP LV2 AU Standalone; do
            if [ -d "$src/$format" ]; then cp -R "$src/$format" "dist/$name/"; fi
          done
          cp LICENSE README.md README.ru.md resources/kits/CREDITS.md "dist/$name/"

          if [ "$RUNNER_OS" = "macOS" ]; then
            # Unsigned builds still need a valid ad-hoc signature to load on Apple Silicon.
            find "dist/$name" -mindepth 2 -maxdepth 2 \( -name "*.vst3" -o -name "*.clap" -o -name "*.component" \
              -o -name "*.lv2" -o -name "*.app" \) -exec codesign --force --deep --sign - {} \;
          fi

          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            zip -qry "$name.zip" "$name"
          fi
          echo "ARCHIVE=dist/$name.zip" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist (e.g. created by hand with some of the
          # archives); then just add or replace the archives.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Tabify Drums ${GITHUB_REF_NAME#v}" \
              --notes "Download the archive for your platform, unzip it and copy the plugin format you use into your plugin folder (paths are in the README). Builds are not code-signed: on macOS remove the quarantine flag with xattr -dr com.apple.quarantine <plugin>."
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
